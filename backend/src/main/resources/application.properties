spring.application.name=backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/stock_brokerage
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==============================
# JWT (SRS Appendix D)
# ==============================
# Base64-encoded 256-bit secret. This is a development-only default -
# rotate and inject via a real secret store (env var / vault) in any
# non-local deployment. Never commit a production secret here.
jwt.secret=MzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
# Token validity: 8h client, 12h staff (dealer/analyst/compliance/risk mgr), 24h admin
jwt.expiration.client-ms=28800000
jwt.expiration.staff-ms=43200000
jwt.expiration.admin-ms=86400000

# ==============================
# Field-level encryption (SRS FR15) - AES-256 key, Base64-encoded.
# Development-only default - rotate/inject via a real secret store in
# any non-local deployment.
# ==============================
security.encryption.key=Xi7Es7aCU03GBPBHTTX/ddMRyJ6ckC74HgkUWN3PsKc=

# ==============================
# Trading / settlement / tax rates (SRS FR7/FR10) - see TradingProperties
# ==============================
trading.brokerage-rate=0.0003
trading.gst-rate=0.18
trading.stt-rate=0.001
trading.exchange-charge-rate=0.0000325
trading.stamp-duty-rate=0.00015
trading.margin-call-threshold=0.80
trading.square-off-threshold=0.90
trading.ltcg-exemption=125000
trading.ltcg-tax-rate=0.125
trading.stcg-tax-rate=0.20
trading.long-term-holding-days=365